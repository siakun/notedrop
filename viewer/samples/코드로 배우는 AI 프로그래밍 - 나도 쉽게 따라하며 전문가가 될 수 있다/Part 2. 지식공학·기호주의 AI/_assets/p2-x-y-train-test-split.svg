<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">입력 X와 출력 y가 학습용과 테스트용 변수로 나뉘는 구조</title>
  <desc id="desc">상단에서 X는 입력값, y는 출력값으로 표시하고, train_test_split 이후 하단에서 학습용과 테스트용 변수로 나뉘는 구조를 보여 주는 카드형 도식</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef4fb" />
    </linearGradient>

    <linearGradient id="xGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fb8ff" />
      <stop offset="100%" stop-color="#1187d7" />
    </linearGradient>

    <linearGradient id="yGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38d39f" />
      <stop offset="100%" stop-color="#12a975" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8ca3bf" flood-opacity="0.16" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#8ca3bf" flood-opacity="0.12" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>

    <style>
      text {
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Arial, sans-serif;
        fill: #0f172a;
      }
      .title {
        font-size: 24px;
        font-weight: 800;
        fill: #334155;
      }
      .guide {
        stroke: #cbd5e1;
        stroke-width: 2;
      }
      .surface {
        fill: rgba(255, 255, 255, 0.78);
        stroke: rgba(148, 163, 184, 0.22);
        stroke-width: 1.5;
      }
      .cardStroke {
        stroke: rgba(255, 255, 255, 0.26);
        stroke-width: 1.4;
      }
      .kicker {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        fill: rgba(255, 255, 255, 0.9);
      }
      .bigToken {
        font-size: 34px;
        font-weight: 800;
        fill: #ffffff;
      }
      .cardDetail {
        font-size: 17px;
        font-weight: 600;
        fill: rgba(255, 255, 255, 0.94);
      }
      .panelTitle {
        font-size: 22px;
        font-weight: 800;
        fill: #334155;
      }
      .panelDetail {
        font-size: 15px;
        font-weight: 600;
        fill: #64748b;
      }
      .token {
        font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
      }
      .splitLabel {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        fill: #64748b;
      }
      .splitToken {
        font-size: 22px;
        font-weight: 800;
        fill: #334155;
        font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
      }
      .arrowLine {
        stroke: #64748b;
        stroke-width: 2.6;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="980" height="620" fill="url(#bg)" />

  <g filter="url(#softShadow)">
    <rect x="312" y="28" width="356" height="54" rx="27" class="surface" />
  </g>
  <text class="title" x="490" y="62" text-anchor="middle">분할 전과 분할 후의 변수 이름</text>

  <line class="guide" x1="110" y1="106" x2="870" y2="106" />

  <g filter="url(#shadow)">
    <rect x="128" y="138" width="286" height="126" rx="28" fill="url(#xGrad)" class="cardStroke" />
    <rect x="566" y="138" width="286" height="126" rx="28" fill="url(#yGrad)" class="cardStroke" />
  </g>

  <text class="kicker" x="160" y="174">입력값</text>
  <text class="bigToken token" x="271" y="215" text-anchor="middle">X</text>
  <text class="cardDetail" x="271" y="244" text-anchor="middle">전체 Feature 행렬</text>

  <text class="kicker" x="598" y="174">출력값</text>
  <text class="bigToken token" x="709" y="215" text-anchor="middle">y</text>
  <text class="cardDetail" x="709" y="244" text-anchor="middle">전체 Label 벡터</text>

  <path class="arrowLine" d="M 271 280 C 271 304, 330 314, 420 322" />
  <path class="arrowLine" d="M 709 280 C 709 304, 650 314, 560 322" />

  <g filter="url(#softShadow)">
    <rect x="380" y="320" width="220" height="62" rx="24" class="surface" />
  </g>
  <text class="splitLabel" x="490" y="344" text-anchor="middle">데이터 분할</text>
  <text class="splitToken" x="490" y="366" text-anchor="middle">train_test_split</text>

  <path class="arrowLine" d="M 450 388 C 420 412, 362 426, 290 438" />
  <path class="arrowLine" d="M 530 388 C 560 412, 618 426, 690 438" />

  <g filter="url(#shadow)">
    <rect x="54" y="438" width="394" height="148" rx="30" class="surface" />
    <rect x="532" y="438" width="394" height="148" rx="30" class="surface" />
  </g>

  <text class="panelTitle" x="86" y="474">학습용 변수</text>
  <text class="panelDetail" x="86" y="498">모델을 학습시키는 데 쓰는 데이터</text>

  <g filter="url(#softShadow)">
    <rect x="82" y="514" width="164" height="50" rx="18" fill="url(#xGrad)" class="cardStroke" />
    <rect x="256" y="514" width="164" height="50" rx="18" fill="url(#yGrad)" class="cardStroke" />
  </g>
  <text class="kicker" x="102" y="534">입력</text>
  <text class="kicker" x="276" y="534">정답</text>
  <text class="bigToken token" x="164" y="548" text-anchor="middle" style="font-size: 22px;">X_train</text>
  <text class="bigToken token" x="338" y="548" text-anchor="middle" style="font-size: 22px;">y_train</text>

  <text class="panelTitle" x="564" y="474">테스트용 변수</text>
  <text class="panelDetail" x="564" y="498">학습 후 성능을 확인하는 데이터</text>

  <g filter="url(#softShadow)">
    <rect x="560" y="514" width="164" height="50" rx="18" fill="url(#xGrad)" class="cardStroke" />
    <rect x="734" y="514" width="164" height="50" rx="18" fill="url(#yGrad)" class="cardStroke" />
  </g>
  <text class="kicker" x="580" y="534">입력</text>
  <text class="kicker" x="754" y="534">정답</text>
  <text class="bigToken token" x="642" y="548" text-anchor="middle" style="font-size: 22px;">X_test</text>
  <text class="bigToken token" x="816" y="548" text-anchor="middle" style="font-size: 22px;">y_test</text>
</svg>
