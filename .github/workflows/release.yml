name: Release

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: ver
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Manifest version: $VERSION"

      - name: Check tag existence
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${{ steps.ver.outputs.version }} already exists — skip release. Bump manifest.json to release a new version."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${{ steps.ver.outputs.version }} not found — will build + tag + release."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci

      - name: Build viewer (embedded into plugin)
        working-directory: viewer
        run: npm run build

      - name: Typecheck
        working-directory: plugin
        run: npm run typecheck

      - name: Test
        working-directory: plugin
        run: npm test

      - name: Build plugin
        working-directory: plugin
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create + push tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "release v$VERSION (auto from manifest.json)"
          git push origin "$VERSION"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.check.outputs.version }}
          tag_name: ${{ needs.check.outputs.version }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
          fail_on_unmatched_files: true
